# Server Configuration
server.port=8085
server.address=0.0.0.0
server.servlet.context-path=/

# Database Configuration
spring.datasource.url=jdbc:mariadb://localhost:3306/easyfood?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=easyfood
spring.datasource.password=1290!@()kyhq
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect
spring.jpa.properties.hibernate.default_batch_fetch_size=100
spring.jpa.open-in-view=false

# JWT Configuration
jwt.secret=ThisIsAVeryLongSecretKeyForJWTTokenGenerationAndItShouldBeAtLeast256BitsLong
jwt.expiration=86400000

# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Logging Configuration
logging.level.root=INFO
logging.level.com.krecipe=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# CORS Configuration (통합 관리 - CorsConfig.java에서 사용)
cors.allowed-origins=http://localhost:3000,http://127.0.0.1:3000,http://hobbygom.ddns.net:3000,http://hobbygom.ddns.net:8085
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS,PATCH,HEAD
cors.max-age=3600

# Jackson Configuration
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=Asia/Seoul
spring.jackson.serialization.fail-on-empty-beans=false

# Error Handling
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=on_param
server.error.include-exception=true

# Session Configuration
# 세션 유지 시간 (분 단위, 기본값: 1440분 = 24시간)
server.servlet.session.timeout=1440m
# 세션 쿠키 설정
server.servlet.session.cookie.name=EASYFOOD_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=false
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.max-age=86400
# 세션 저장 방식 (인메모리 - 서버 재시작 시 만료)
spring.session.store-type=none

# CSRF Configuration
# 개발 환경 판단 (프로파일을 통해 제어)
spring.profiles.active=local
# CSRF 토큰 저장 방식
security.csrf.token-repository=cookie

# File Storage Configuration
# 파일 업로드 저장 경로 (절대 경로 또는 상대 경로)
file.upload.dir=H:/dev_project/EasyFood/storage
# 파일 접근 URL 경로
file.upload.url-path=/uploads
# 서버 기본 URL (개발 환경)
file.upload.base-url=http://localhost:8085
# 허용되는 파일 확장자 (쉼표로 구분)
file.upload.allowed-extensions=jpg,jpeg,png,gif,webp
# 최대 파일 크기 (바이트 단위, 10MB = 10485760)
file.upload.max-file-size=10485760
