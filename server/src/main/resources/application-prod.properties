# Production Profile Configuration

# Session Configuration (Override for production)
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=strict

# CSRF Configuration (Enable for production)
security.csrf.enabled=true

# File Storage Configuration (Override for production)
file.upload.base-url=http://hobbygom.ddns.net:8085

# Logging Configuration (Less verbose in production)
logging.level.root=WARN
logging.level.com.krecipe=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=WARN
