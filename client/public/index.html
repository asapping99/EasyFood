<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="집에서 쉽게 만들 수 있는 다양한 레시피를 발견하고 공유하세요" />
    <meta name="keywords" content="한국요리, 레시피, 요리법, 음식, 요리" />
    <meta name="author" content="K-Recipe Team" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="K-Recipe - 레시피 플랫폼" />
    <meta property="og:description" content="집에서 쉽게 만들 수 있는 다양한 요리 레시피를 발견하고 공유하세요" />
    <meta property="og:image" content="/favicon.ico" />
    
    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:title" content="K-Recipe - 레시피 플랫폼" />
    <meta property="twitter:description" content="집에서 쉽게 만들 수 있는 다양한 요리 레시피를 발견하고 공유하세요" />
    
    <title>K-Recipe - 맛있는 한국 요리 레시피</title>
    <link rel="icon" href="/favicon.ico" />
    
    <!-- 폰트 사전 로드 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* 로딩 스크린 */
        #initial-loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #FFF7ED 0%, #FEF2F2 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }
        
        .loader-chef {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #EA580C 0%, #DC2626 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: bounce 1.5s ease-in-out infinite;
            margin-bottom: 20px;
        }
        
        .loader-text {
            font-family: 'Noto Sans KR', sans-serif;
            font-size: 18px;
            font-weight: 600;
            color: #374151;
            margin-bottom: 10px;
        }
        
        .loader-subtext {
            font-family: 'Noto Sans KR', sans-serif;
            font-size: 14px;
            color: #6B7280;
        }
        
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }
        
        /* 폰트 설정 */
        * {
            font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
        }
        
        /* 스크롤바 스타일 */
        ::-webkit-scrollbar {
            width: 8px;
        }
        
        ::-webkit-scrollbar-track {
            background: #f1f1f1;
        }
        
        ::-webkit-scrollbar-thumb {
            background: #EA580C;
            border-radius: 4px;
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: #DC2626;
        }
    </style>
</head>
<body>
    <!-- 초기 로딩 화면 -->
    <div id="initial-loader">
        <div class="loader-chef">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M6 2L3 6V20C3 21.1 3.9 22 5 22H19C20.1 22 21 21.1 21 20V6L18 2H6Z" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                <polyline points="9,9 9,22 15,22 15,9" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </div>
        <div class="loader-text">K-Recipe 로딩 중...</div>
        <div class="loader-subtext">맛있는 레시피를 준비하고 있어요</div>
    </div>

    <div id="root"></div>
    
    <script>
        // 로딩 화면 제거
        window.addEventListener('load', function() {
            setTimeout(function() {
                const loader = document.getElementById('initial-loader');
                if (loader) {
                    loader.style.opacity = '0';
                    loader.style.transition = 'opacity 0.5s ease-out';
                    setTimeout(function() {
                        loader.remove();
                    }, 500);
                }
            }, 1000);
        });
    </script>
</body>
</html>
